name: Update Antigravity Version

on:
  schedule:
    # Run every 7 days at 00:00 UTC
    - cron: '0 0 */7 * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for updates
        id: check
        run: |
          chmod +x scripts/update.sh
          ./scripts/update.sh
          
          if git diff --quiet flake.nix; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No updates available"
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            NEW_VERSION=$(grep 'version = ' flake.nix | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "New version found: $NEW_VERSION"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update antigravity to ${{ steps.check.outputs.version }}"
          title: "Update Antigravity to ${{ steps.check.outputs.version }}"
          body: |
            ## Automatic Update
            
            This PR updates Antigravity CLI to version `${{ steps.check.outputs.version }}`.
            
            ### Changes
            - Updated version in `flake.nix`
            - Updated SHA-512 checksums for all platforms
            - Verified manifest integrity
            
            ### Testing
            Please verify the build works:
            ```bash
            nix flake check
            nix build
            ./result/bin/antigravity --version
            ```
            
            ---
            *This PR was automatically created by the update workflow.*
          branch: update-antigravity-${{ steps.check.outputs.version }}
          delete-branch: true
          labels: |
            automated
            dependencies

      - name: Enable auto-merge
        if: steps.check.outputs.updated == 'true'
        run: |
          echo "Pull request created successfully"
          echo "Review and merge at: ${{ github.server_url }}/${{ github.repository }}/pulls"
